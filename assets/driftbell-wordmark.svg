<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="520" height="150" role="img" aria-label="Driftbell">
  <!-- Same glyph as driftbell-mark.svg, so the two stay in step. It is centred
       on x=48 there, and translate(6) puts that axis back on 54 where it sat
       before, leaving the gap to the wordmark unchanged. -->
  <g transform="translate(6 14)">
    <path d="M12 60 C12 30 24 14 48 14 C72 14 84 30 84 60 Z" fill="none" stroke="#7F8C99" stroke-width="5" stroke-linejoin="round"/>
    <path d="M48 14 V6" fill="none" stroke="#7F8C99" stroke-width="5" stroke-linecap="round"/>
    <circle cx="48" cy="76" r="6" fill="#EF9F27"/>
    <path d="M10 96 C24 88 34 104 48 96 C62 88 72 104 86 96" fill="none" stroke="#EF9F27" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="118" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, sans-serif" font-size="58" font-weight="500" letter-spacing="-1.5" fill="#7F8C99">drift<tspan fill="#EF9F27">bell</tspan></text>
  <text x="120" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, sans-serif" font-size="17" fill="#8A8F98">the model drifted. you get a ring.</text>
</svg>
